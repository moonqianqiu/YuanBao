name: Build Electron App

on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    name: Build ${{ matrix.app }} Windows x64
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: YuanBao
            config: configs/yuanbao.json
          - app: HunYuan
            config: configs/hunyuan.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest Safari macOS UA (best effort)
        shell: bash
        run: |
          URL="https://raw.githubusercontent.com/ray-lothian/UserAgent-Switcher/refs/heads/master/v3/data/popup/browsers/safari-mac%20os.json"
          if UA=$(curl -sfL --max-time 30 "$URL"); then
            BEST=$(printf '%s' "$UA" | node -e "
              let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                try{
                  const list=JSON.parse(d);
                  const best=list
                    .map(e=>({ua:e.ua,ver:parseFloat(e.browser&&e.browser.version)}))
                    .filter(e=>e.ua&&!isNaN(e.ver))
                    .sort((a,b)=>b.ver-a.ver)[0];
                  console.log(best?best.ua:'');
                }catch{console.log('')}
              });")
            if [ -n "$BEST" ]; then
              echo "UA=$BEST" >> "$GITHUB_ENV"
              echo "Fetched UA: $BEST"
            else
              echo "UA parse failed, fallback to dynamic Chromium UA"
              echo "UA=" >> "$GITHUB_ENV"
            fi
          else
            echo "UA fetch failed, fallback to dynamic Chromium UA"
            echo "UA=" >> "$GITHUB_ENV"
          fi

      - name: Inject proxy from secrets (optional)
        env:
          PROXY_YUANBAO: ${{ secrets.YUANBAO_PROXY }}
          PROXY_HUNYUAN: ${{ secrets.HUNYUAN_PROXY }}
        run: |
          $configMap = @{
            "YuanBao" = "configs/yuanbao.app.json"
            "HunYuan" = "configs/hunyuan.app.json"
          }
          $secretMap = @{
            "YuanBao" = $env:PROXY_YUANBAO
            "HunYuan" = $env:PROXY_HUNYUAN
          }
          if (-not $configMap.ContainsKey("${{ matrix.app }}")) {
            Write-Error "Unknown matrix app: ${{ matrix.app }}"
            exit 1
          }
          $proxy = $secretMap["${{ matrix.app }}"]
          $file = $configMap["${{ matrix.app }}"]
          $json = Get-Content $file -Raw | ConvertFrom-Json
          if ($proxy -and $proxy.Trim()) {
            $json.proxy = $proxy.Trim()
            Write-Output "Proxy injected into $file (value hidden)"
          } else {
            Write-Output "No proxy secret set for ${{ matrix.app }}, skipping"
          }
          if ($env:UA) {
            $json.userAgent = $env:UA
            Write-Output "UA injected into $file"
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content $file -Encoding UTF8

      - name: Build Electron App
        run: npx electron-builder --win --x64 --config ${{ matrix.config }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build output
        run: |
          if (!(Test-Path "dist")) {
            Write-Error "构建失败：dist 目录不存在"
            exit 1
          }
          Get-ChildItem -Path "dist" -Recurse

      - name: Stage artifact as ${{ matrix.app }} directory
        run: |
          New-Item -ItemType Directory -Path "stage/${{ matrix.app }}" -Force | Out-Null
          Copy-Item -Path "dist\win-unpacked\*" -Destination "stage\${{ matrix.app }}" -Recurse -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-Desktop-Win64
          path: stage/${{ matrix.app }}
          retention-days: 3
          if-no-files-found: error
