name: Build Electron App

on:
  workflow_dispatch: # 手动触发

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build output
        run: |
          if (!(Test-Path "dist")) {
            Write-Error "构建失败：dist 目录不存在"
            exit 1
          }
          Get-ChildItem -Path "dist" -Recurse

      - name: Stage artifact as YuanBao directory
        run: |
          New-Item -ItemType Directory -Path "stage/YuanBao" -Force | Out-Null
          Copy-Item -Path "dist\win-unpacked\*" -Destination "stage\YuanBao" -Recurse -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: YuanBao-Desktop-Win64
          path: stage/YuanBao
          retention-days: 3
          if-no-files-found: error
