name: Build Electron App

on:
  workflow_dispatch: # 手动触发
    inputs:
      app:
        description: '选择要构建的应用'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - YuanBao
          - HunYuan

jobs:
  # 依据输入动态生成构建矩阵：只选单个应用时跳过另一个，job 级 if 拿不到 matrix 上下文，
  # 故先在轻量 ubuntu job 里算出矩阵再传给 build
  targets:
    name: Pick build targets
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        run: |
          case "${{ github.event.inputs.app }}" in
            YuanBao) include='[{"app":"YuanBao","config":"configs/yuanbao.json"}]' ;;
            HunYuan) include='[{"app":"HunYuan","config":"configs/hunyuan.json"}]' ;;
            *)       include='[{"app":"YuanBao","config":"configs/yuanbao.json"},{"app":"HunYuan","config":"configs/hunyuan.json"}]' ;;
          esac
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    name: Build ${{ matrix.app }} Windows x64
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci


      - name: Inject proxy from secrets (optional)
        env:
          PROXY_YUANBAO: ${{ secrets.YUANBAO_PROXY }}
          PROXY_HUNYUAN: ${{ secrets.HUNYUAN_PROXY }}
        run: |
          $configMap = @{
            "YuanBao" = "configs/yuanbao.app.json"
            "HunYuan" = "configs/hunyuan.app.json"
          }
          $secretMap = @{
            "YuanBao" = $env:PROXY_YUANBAO
            "HunYuan" = $env:PROXY_HUNYUAN
          }
          if (-not $configMap.ContainsKey("${{ matrix.app }}")) {
            Write-Error "Unknown matrix app: ${{ matrix.app }}"
            exit 1
          }
          $proxy = $secretMap["${{ matrix.app }}"]
          $file = $configMap["${{ matrix.app }}"]
          $json = Get-Content $file -Raw | ConvertFrom-Json
          if ($proxy -and $proxy.Trim()) {
            $json.proxy = $proxy.Trim()
            Write-Output "Proxy injected into $file (value hidden)"
          } else {
            Write-Output "No proxy secret set for ${{ matrix.app }}, skipping"
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content $file -Encoding UTF8

      - name: Build Electron App
        run: npx electron-builder --win --x64 --config ${{ matrix.config }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build output
        run: |
          if (!(Test-Path "dist")) {
            Write-Error "构建失败：dist 目录不存在"
            exit 1
          }
          Get-ChildItem -Path "dist" -Recurse

      - name: Stage artifact as ${{ matrix.app }} directory
        run: |
          New-Item -ItemType Directory -Path "stage/${{ matrix.app }}" -Force | Out-Null
          Copy-Item -Path "dist\win-unpacked\*" -Destination "stage\${{ matrix.app }}" -Recurse -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}
          path: stage/${{ matrix.app }}
          retention-days: 3
          if-no-files-found: error
