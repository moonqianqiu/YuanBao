name: Build Electron App

on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    name: Build ${{ matrix.app }} Windows x64
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: YuanBao
            config: configs/yuanbao.json
          - app: HunYuan
            config: configs/hunyuan.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject proxy from secrets (optional)
        env:
          PROXY_YUANBAO: ${{ secrets.YUANBAO_PROXY }}
          PROXY_HUNYUAN: ${{ secrets.HUNYUAN_PROXY }}
        run: |
          $configMap = @{
            "YuanBao" = "configs/yuanbao.app.json"
            "HunYuan" = "configs/hunyuan.app.json"
          }
          $secretMap = @{
            "YuanBao" = $env:PROXY_YUANBAO
            "HunYuan" = $env:PROXY_HUNYUAN
          }
          if (-not $configMap.ContainsKey("${{ matrix.app }}")) {
            Write-Error "Unknown matrix app: ${{ matrix.app }}"
            exit 1
          }
          $proxy = $secretMap["${{ matrix.app }}"]
          if ($proxy -and $proxy.Trim()) {
            $file = $configMap["${{ matrix.app }}"]
            $json = Get-Content $file -Raw | ConvertFrom-Json
            $json.proxy = $proxy.Trim()
            $json | ConvertTo-Json -Depth 10 | Set-Content $file -Encoding UTF8
            Write-Output "Proxy injected into $file (value hidden)"
          } else {
            Write-Output "No proxy secret set for ${{ matrix.app }}, skipping"
          }

      - name: Build Electron App
        run: npx electron-builder --win --x64 --config ${{ matrix.config }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build output
        run: |
          if (!(Test-Path "dist")) {
            Write-Error "构建失败：dist 目录不存在"
            exit 1
          }
          Get-ChildItem -Path "dist" -Recurse

      - name: Stage artifact as ${{ matrix.app }} directory
        run: |
          New-Item -ItemType Directory -Path "stage/${{ matrix.app }}" -Force | Out-Null
          Copy-Item -Path "dist\win-unpacked\*" -Destination "stage\${{ matrix.app }}" -Recurse -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-Desktop-Win64
          path: stage/${{ matrix.app }}
          retention-days: 3
          if-no-files-found: error
